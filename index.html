<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 
    <title>Doação de Sangue</title>
</head>
<body>
    <div class="caixa">
        <h2>Formulário de Doação de Sangue</h2>
        <form id="FormSangue">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Informe seu nome completo" required>
            <br>
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Informe seu Email" required>
            <br>
            <label for="idade">idade</label>
            <input type="number" id="idade" placeholder="Informe sua idade" required>
            <br>
            <label for="tipoS">Tipo de sanque</label required>
            <select name="tipoS" id="tipoS">
               <option value="">Selecione</option>
            <br>
            <option value="aP">A+</option>
            <option value="aN">A-</option>  
            <option value="bP">B+</option>
            <option value="bN">B-</option>   
            <option value="abP">AB+</option>
            <option value="abN">AB-</option> 
            <option value="oP">O+</option>
            <option value="oN">O-</option>      
            </select >
            <br>
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="Informe seu telefone" required>
            <br>
            <label for="estado">Estado</label>
            <input type="text" id="estado" placeholder="Informe seu Estado" required>
            <br>
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Informe sua Cidade" required>
            <br>
            <button type="submit">Enviar</button>
        </form>
         <div id="resultado"></div>
    <script src="scripts/scripts.js"></script>
    </div>
</body>
</html>
